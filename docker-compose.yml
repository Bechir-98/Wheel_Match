services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wheel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/schema_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - SLM_URL=http://slm:8080
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads

  # ponytail: CPU-only llama-server; rule ranking serves when slm is down
  slm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - llama-models:/models
    environment:
      - LLAMA_ARG_MODEL_URL=https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true
      - LLAMA_ARG_MODEL=/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=4096
      - LLAMA_ARG_N_PARALLEL=2
      - LLAMA_ARG_PORT=8080

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - DOCKER=1

volumes:
  pgdata:
  llama-models: